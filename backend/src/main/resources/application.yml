server:
  port: ${PORT:8080}

spring:
  application:
    name: keystone

  datasource:
    url: ${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://dpg-dbvodh2fngtc7389uuag-a:5432/keystone_zvfz}}
    username: ${JDBC_DATABASE_USERNAME:${DATABASE_USERNAME:keystone_user}}
    password: ${JDBC_DATABASE_PASSWORD:${DATABASE_PASSWORD:ZolPrSkrXMV31R5lZxc97bN4t2TkFLl7}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
    locations: classpath:db/migration

# Custom App Security configurations
app:
  jwt:
    # 256-bit HS256 secret key (base64 encoded or simple secret)
    # The default is: KeystoneSecretKeyMustBeAtLeast256BitsForHS256SecurityStandards2026
    secret: ${JWT_SECRET:KeystoneSecretKeyMustBeAtLeast256BitsForHS256SecurityStandards2026}
    # Token valid for 24 hours (86400000 ms)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Springdoc OpenAPI configurations
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
